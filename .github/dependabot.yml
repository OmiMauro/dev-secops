# Dependabot opens pull requests to keep dependencies up to date.
# Security updates (for known CVEs) are separate: enable them in
# Settings → Advanced Security → Dependabot security updates.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing a brand-new release. Most malicious
    # package versions are detected and pulled within hours or days.
    # This does not delay security updates.
    cooldown:
      default-days: 7
    # One PR per group instead of one per package: less noise.
    groups:
      # Every @nestjs/* package, production AND development: NestJS
      # packages declare each other as peer dependencies, so they must move
      # together. Split across two PRs, neither one installs (ERESOLVE).
      nestjs:
        patterns: ["@nestjs/*"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["@nestjs/*"]
    ignore:
      # @types/node must match the Node version we RUN (.nvmrc, Dockerfile),
      # not the newest one. A Node major upgrade is done by hand, see below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # Also bumps the pinned SHAs in .github/workflows/*.yml
  # (and keeps the "# vX.Y.Z" comment in sync).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Bumps the base image digests in the Dockerfile, e.g. when the
  # distroless image gets a security patch.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A Node major upgrade touches .nvmrc, @types/node, the build images
      # AND the runtime image, whose NAME changes (distroless/nodejs24 →
      # nodejs26). Dependabot can only bump one tag, so it would build with
      # Node 26 and run on Node 24. Major upgrades are done by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Bumps the AWS provider version and .terraform.lock.hcl.
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
