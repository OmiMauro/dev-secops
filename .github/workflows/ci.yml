name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: by default GITHUB_TOKEN can write to the repo.
# This workflow only needs to read the code.
permissions:
  contents: read

# If you push twice in a row, cancel the previous run.
# Saves Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # If something hangs, don't burn 6 hours (the default maximum).
    timeout-minutes: 10

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag (v7) can be
      # moved to other code if the author's account is compromised;
      # a SHA is immutable. The comment shows the human-readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token stored in .git/config for later
          # steps (none of them needs to push).
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says: the same
      # versions as on your machine, nothing "newer" sneaks in.
      - name: Install dependencies
        run: npm ci

      # Checks that every package was signed by the npm registry and, where
      # available, has provenance: proof of which repo and CI built it.
      - name: Verify package signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: by default checkout only fetches the last commit,
          # and a secret removed later would still be in older commits.
          fetch-depth: 0

      # The pre-commit hook can be skipped with `git commit --no-verify`.
      # This job cannot: it is the safety net.
      - name: Scan the whole git history
        run: scripts/security/secrets.sh history

  sca:
    name: Dependency scanning (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload results to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan package-lock.json
        run: scripts/security/sca.sh

      # always(): upload the findings even when the gate failed,
      # that is precisely when you want to see them.
      - name: Upload results to GitHub Security
        if: always() && hashFiles('reports/sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/sca.sarif
          category: trivy-sca

  # Only on pull requests: compares the dependencies of the PR against
  # the base branch and fails if the PR ADDS a vulnerable package.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Our custom rules are code too: test them before trusting them.
      - name: Test custom rules
        run: scripts/security/sast.sh test

      - name: Scan source code
        run: scripts/security/sast.sh scan

      - name: Upload results to GitHub Security
        if: always() && hashFiles('reports/sast.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/sast.sarif
          category: semgrep
