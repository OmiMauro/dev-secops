# DevSecOps pipeline. Every security job runs the same script you can run
# locally (scripts/security/*.sh), so results match on both sides.
#
#   build ─────────────┐
#   workflows ─────────┤
#   secrets ───────────┤
#   sca ───────────────┤
#   dependency-review ─┤  (pull requests only)
#   sast ──────────────┼──▶ gate ──▶ release ──▶ promote.yml (manual)
#   iac ───────────────┤      ▲        │           develop → staging → qa
#   image ──┬──────────┤      │        │           → preprod → prod
#           └─▶ dast ──┘      │        └─ push to main only
#                             └─ the single check required by branch protection
#
# Build once, promote: the image is built ONCE, in the "image" job. That
# exact image (same config digest) is scanned, attacked by DAST, published,
# signed, and then promoted between environments by moving a tag. Nothing
# downstream ever runs `docker build` again. See docs/10-pipeline.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, even without new commits: new CVEs are published every day for
  # code that has not changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: no permissions at all by default. Each job asks only
# for what it needs, with a comment saying why.
permissions: {}

# If you push twice in a row, cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    # If something hangs, don't burn 6 hours (the default maximum).
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag (v7) can be
      # moved to other code if the author's account is compromised;
      # a SHA is immutable. The comment shows the human-readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token stored in .git/config for later
          # steps (none of them needs to push).
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what package-lock.json says: the same
      # versions as on your machine, nothing "newer" sneaks in.
      - name: Install dependencies
        run: npm ci

      # Checks that every package was signed by the npm registry and, where
      # available, has provenance: proof of which repo and CI built it.
      - name: Verify package signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  workflows:
    name: Pipeline security (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # clone the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflow files
        run: scripts/security/workflows.sh

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: by default checkout only fetches the last commit,
          # and a secret removed later would still be in older commits.
          fetch-depth: 0

      # The pre-commit hook can be skipped with `git commit --no-verify`.
      # This job cannot: it is the safety net.
      - name: Scan the whole git history
        run: scripts/security/secrets.sh history

  sca:
    name: Dependency scanning (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository
      security-events: write # upload results to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan package-lock.json
        run: scripts/security/sca.sh

      # always(): upload the findings even when the gate failed,
      # that is precisely when you want to see them.
      - name: Upload results to GitHub Security
        if: always() && hashFiles('reports/sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/sca.sarif
          category: trivy-sca

  # Only on pull requests: compares the dependencies of the PR against
  # the base branch and fails if the PR ADDS a vulnerable package.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the dependency graph of both branches

    steps:
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository
      security-events: write # upload results to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Our custom rules are code too: test them before trusting them.
      - name: Test custom rules
        run: scripts/security/sast.sh test

      - name: Scan source code
        run: scripts/security/sast.sh scan

      - name: Upload results to GitHub Security
        if: always() && hashFiles('reports/sast.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/sast.sarif
          category: semgrep

  # Builds the image ONCE. Every later job uses this exact image, passed
  # along as an artifact, so what gets scanned is what gets released.
  image:
    name: Container image (build once + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # clone the repository
      security-events: write # upload results to the Security tab
    outputs:
      # Fingerprint of the image content. The release job checks that the
      # image it publishes has exactly this digest.
      config-digest: ${{ steps.save.outputs.config-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and scan the image
        run: scripts/security/image.sh

      - name: Save the image for the next jobs
        id: save
        run: |
          docker save dev-secops:local -o image.tar
          echo "config-digest=$(scripts/release/config-digest.sh image.tar)" >> "$GITHUB_OUTPUT"

      - name: Share the image with dast and release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1 # only needed during this run

      - name: Upload Dockerfile results
        if: always() && hashFiles('reports/dockerfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/dockerfile.sarif
          category: trivy-dockerfile

      - name: Upload image results
        if: always() && hashFiles('reports/image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/image.sarif
          category: trivy-image

  iac:
    name: Infrastructure as Code (Checkov + Conftest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository
      security-events: write # upload results to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate, scan and apply policies
        run: scripts/security/iac.sh

      - name: Upload results to GitHub Security
        if: always() && hashFiles('reports/checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/checkov.sarif
          category: checkov

  # Starts the real stack (PostgreSQL + Vault + the API image) and attacks
  # it with OWASP ZAP. Slowest job, so it runs in parallel with the rest.
  # Starts the real stack (PostgreSQL + Vault + the API) and attacks it
  # with OWASP ZAP. The API runs the image built by the "image" job.
  dast:
    name: Dynamic scan (OWASP ZAP)
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # clone the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      # Random values for this run only. The environment is destroyed when
      # the job ends, so they never need to be stored anywhere.
      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^VAULT_ROOT_TOKEN=.*|VAULT_ROOT_TOKEN=$(openssl rand -hex 16)|" \
            .env

      # --no-build: run the loaded image, never a fresh build.
      # The rate limits are raised ONLY here: ZAP sends hundreds of attacks
      # to the same routes, and 429 answers would hide what it is testing.
      - name: Start the stack
        env:
          SWAGGER_ENABLED: "true"
          THROTTLE_LIMIT: "100000"
          AUTH_THROTTLE_LIMIT: "100000"
        run: scripts/stack.sh up --no-build

      - name: Scan with ZAP
        run: scripts/security/dast.sh

      - name: API logs (on failure)
        if: failure()
        run: docker compose --profile app logs api

      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: reports/zap/report.*
          if-no-files-found: ignore

  gate:
    name: Security gate
    if: always()
    needs: [build, workflows, secrets, sca, dependency-review, sast, image, iac, dast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only reads the results of the other jobs

    steps:
      # "skipped" is fine: dependency-review only runs on pull requests.
      - name: Check that no job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "At least one security check failed."
            exit 1
          fi

  # Publishes the image ONLY if the gate passed, and only from main.
  # Pull requests, scheduled runs and failed gates never produce a release.
  # Publishes the image ONLY if the gate passed, and only from main.
  # Pull requests, scheduled runs and failed gates never produce a release.
  # It does not build anything: it publishes the image from the "image" job.
  release:
    name: Publish, SBOM and sign
    # always() + an explicit check on the gate, NOT the default success():
    # success() looks at every ancestor job, and dependency-review is always
    # skipped on pushes, so release was silently skipped on every push too.
    if: >-
      always()
      && needs.gate.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # clone the repository
      packages: write # push the image to ghcr.io
      # Lets the job request an OIDC token from GitHub. Cosign exchanges it
      # for a short-lived signing certificate (Sigstore "keyless" signing):
      # no private key to store, rotate or leak.
      id-token: write # keyless signing with Cosign, see above

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lowercase; the repo owner may not be.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      # The artifact could have been replaced between jobs. Refuse to
      # publish anything that is not the image that was scanned.
      - name: Check it is the image that was scanned
        env:
          EXPECTED: ${{ needs.image.outputs.config-digest }}
        run: |
          actual="$(scripts/release/config-digest.sh image.tar)"
          echo "scanned:  $EXPECTED"
          echo "artifact: $actual"
          [[ "$actual" == "$EXPECTED" ]]
          docker load -i image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      # One immutable tag per commit. Environments get their own tags later,
      # by promotion (promote.yml), never by rebuilding.
      - name: Push
        id: push
        env:
          EXPECTED: ${{ needs.image.outputs.config-digest }}
        run: |
          docker tag dev-secops:local "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(crane digest "$IMAGE:sha-$GITHUB_SHA")"
          # Same check on the registry side: the published config must be
          # the scanned one.
          published="sha256:$(crane config "$IMAGE@$digest" | sha256sum | cut -d' ' -f1)"
          echo "published config: $published"
          [[ "$published" == "$EXPECTED" ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # From here on, the image is always referenced by DIGEST. Tags can
      # be moved; the digest is the image content itself.
      - name: Generate SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          scripts/security/sbom.sh "$IMAGE@$DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image and attest the SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx \
            --predicate reports/sbom.cdx.json "$IMAGE@$DIGEST"

      # The same check a deployment (or you) would do before running it:
      # "was this image signed by THIS workflow, on main, of THIS repo?"
      - name: Verify signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # First environment. Same digest, new tag: no rebuild.
      - name: Promote to develop
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: crane tag "$IMAGE@$DIGEST" develop

      - name: Keep the SBOM as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: reports/sbom.*.json
