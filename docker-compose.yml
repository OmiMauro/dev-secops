# Infraestructura de desarrollo. La API la arrancas tú con
# `npm run start:dev`; aquí solo vive la base de datos.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 127.0.0.1 = solo accesible desde tu máquina, no desde la red.
    # Con "5432:5432" a secas quedaría abierta a cualquiera de tu LAN.
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
