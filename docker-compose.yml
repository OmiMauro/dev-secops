# Development:  docker compose up -d                 → only the database;
#               run the API with `npm run start:dev`.
# Full stack:   scripts/stack.sh up                  → also Vault and the
#               API, built from the Dockerfile exactly as it would ship.
# Fixed project name, so container and volume names do not depend on
# the folder the repo was cloned into.
name: dev-secops

services:
  api:
    profiles: [app]
    build: .
    image: dev-secops:local
    # No env_file on purpose: the API receives configuration here, but
    # its SECRETS (DB_PASSWORD, JWT_SECRET) only come from Vault.
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Exposes the OpenAPI spec for the DAST scan. Off unless asked for.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Rate limits (requests per minute per IP). Empty = the safe defaults
      # in src/config/throttler.config.ts. Raised only for the DAST scan.
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-}
      VAULT_ADDR: http://vault:8200
      # Created by scripts/vault/setup.sh and passed by scripts/stack.sh
      # from the shell, never written to a file.
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    # Runtime hardening. Even if the app is compromised:
    read_only: true                  # it cannot write to its filesystem
    cap_drop: [ALL]                  # it has no Linux capabilities
    security_opt:
      - no-new-privileges:true       # and cannot gain new privileges
    tmpfs:
      - /tmp                         # the only writable place, in memory

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 127.0.0.1 = reachable only from your machine, not the network.
    # A plain "5432:5432" would expose it to anyone on your LAN.
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev mode: in memory, already unsealed, a known root token. Perfect for
  # learning, never for production (see docs/08-vault.md).
  vault:
    profiles: [app]
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
